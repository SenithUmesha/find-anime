name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser module syntax
        run: node --check app.js

      - name: Check helper module syntax
        run: node --check lib/search.mjs

      - name: Run search helper tests
        run: node --test tests/*.test.mjs

      - name: Guard against the retired Jikan v3 endpoint
        run: |
          if grep -n "api.jikan.moe/v3" app.js lib/*.mjs index.html; then
            echo "Retired Jikan v3 endpoint found in runtime sources."
            exit 1
          fi

      - name: Verify required static assets
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f lib/search.mjs
          test -f img/icon.png
