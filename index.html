<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b11" />
    <meta
      name="description"
      content="A tiny anime search side project powered by the Jikan API and MyAnimeList data."
    />
    <title>FindAnime — tiny anime search</title>
    <link rel="icon" href="img/icon.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">tiny API side quest</p>
          <h1>Find<span>Anime</span></h1>
          <p class="hero-description">
            Search anime by title, skim the useful bits, then jump out to MyAnimeList when something looks good.
          </p>
        </div>

        <form class="search-panel" id="search-form" role="search">
          <label class="sr-only" for="search-input">Anime title</label>
          <input
            class="search-input"
            id="search-input"
            type="search"
            name="q"
            placeholder="Try: Cowboy Bebop"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button class="search-button" id="search-btn" type="submit">Search</button>
        </form>

        <div class="quick-searches" aria-label="Quick searches">
          <span>Try</span>
          <button type="button" data-query="Frieren">Frieren</button>
          <button type="button" data-query="Cowboy Bebop">Cowboy Bebop</button>
          <button type="button" data-query="One Piece">One Piece</button>
        </div>

        <p class="search-status" id="search-status" role="status" aria-live="polite">
          Search for an anime to start.
        </p>
      </header>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-heading-row">
          <div>
            <p class="eyebrow">Jikan × MyAnimeList</p>
            <h2 id="results-title">Results</h2>
          </div>
          <span class="result-count" id="result-count"></span>
        </div>

        <div class="anime-grid" id="anime" aria-busy="false"></div>

        <div class="load-more-row" id="load-more-row" hidden>
          <button class="load-more-button" id="load-more-btn" type="button">
            Load more
          </button>
        </div>
      </section>

      <footer class="site-footer">
        <p>
          No account, no backend, no tracking. Search data comes from Jikan's unofficial MyAnimeList API.
        </p>
      </footer>
    </main>
  </body>
</html>
